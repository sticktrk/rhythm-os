# Supabase CLI configuration for Rhythm Lighting
# See: https://supabase.com/docs/reference/cli/config

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://localhost:3000/**",
  "rhythmapp://**",
  "lighting.rhythm.app://**",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.delete-user]
verify_jwt = false

[functions.report-bug]
verify_jwt = false

[functions.report-bug-bundle-complete]
verify_jwt = false

[functions.matter-device-profiles]
verify_jwt = false

[functions.remote-access-bootstrap]
verify_jwt = false

[functions.join-home-by-local-device-proof]
verify_jwt = false

[functions.support-access-grant]
verify_jwt = false

# Devices authenticate with a hashed upload token, not a Supabase JWT.
[functions.server-activity-ingest]
verify_jwt = false
