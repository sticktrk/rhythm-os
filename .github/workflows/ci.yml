name: Public source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changed surfaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./tools/ci/detect-changed-surfaces.sh --all --github-output
  source:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner
      - name: Source guard dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - name: Public repository boundaries and deployment fixtures
        run: ./tools/check-repo-invariants.sh
      - name: Rust workspace manifests
        run: cargo metadata --no-deps --format-version 1 > /dev/null
      - name: Edge Function fixtures without credentials or external effects
        run: npx --yes deno@2.9.6 test --deny-net --deny-env --deny-read --deny-write --deny-run --deny-ffi tools/app/supabase/functions/monster-device/broker_test.ts tools/app/supabase/functions/_shared/deployment_config_test.ts tools/app/supabase/functions/report-bug/github_support_issue_test.ts tools/app/supabase/functions/set-subscription-tier/response_test.ts tools/app/supabase/functions/server-activity-ingest/device_lifecycle_contract_test.ts
      - name: Private credential provisioning fixture
        run: python3 tools/tests/test_monster_cloud_secrets.py
  flutter:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
      - name: Dependencies
        working-directory: app/flutter/rhythm_app
        run: flutter pub get
      - name: Analyze
        working-directory: app/flutter/rhythm_app
        run: flutter analyze --no-pub
      - name: Tests
        timeout-minutes: 25
        working-directory: app/flutter/rhythm_app
        run: flutter test --no-pub
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y pkg-config libdbus-1-dev libudev-dev libssl-dev
      - name: Portable workspace tests
        run: cargo test --workspace --all-targets --locked
      - name: Build the contributor server
        run: cargo build --locked -p rhythm-server
      - name: Fresh server startup without cloud configuration
        run: python3 tools/ci/smoke-server.py --binary target/debug/rhythm-server
  dart:
    name: Dart tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [sdk, admin-api]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test
  admin-ui:
    name: Admin UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - run: npm run test:mode-write-payload
      - run: npm run build
  required:
    name: Public contributor checks
    if: always()
    needs: [changes, source, flutter, rust, dart, admin-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Require all contributor checks to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; . == "success")'
