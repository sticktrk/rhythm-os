[workspace]
resolver = "2"
exclude = ["rhythm-os-runtime-modules"]
members = [
    "rhythm-runtime-api",
    "removed-circadian",
    "rhythm-adaptive",
]

[workspace.package]
version = "0.6.109-beta"
edition = "2021"
license = "Apache-2.0"
authors = ["Tim Kijewski <3043754+sticktrk@users.noreply.github.com>"]

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
