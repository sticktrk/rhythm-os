[package]
name = "rhythm-core"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
authors = ["Tim Kijewski <3043754+sticktrk@users.noreply.github.com>"]
description = "Core adaptive lighting algorithms for Rhythm OS"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]
test-support = []

[dependencies]
rhythm-profile = { path = "../rhythm-profile" }
libm = "0.2"
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
async-trait = "0.1"
thiserror = "1.0"
tracing = "0.1"
chrono = "0.4"
chrono-tz = "0.10"
sunrise = "3.0"

# Runtime dependencies
anyhow = "1.0"
log = "0.4"
tokio = { version = "1.0", features = ["rt", "time", "sync"] }
futures = { version = "0.3" }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
