[package]
name = "rhythm-linux-embedded"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Linux embedded appliance runtime for Rhythm OS"
default-run = "rhythm-linux-embedded"

[[bin]]
name = "rhythm-linux-embedded"

[dependencies]
rhythm-server = { path = "../rhythm-server" }
rhythm-os = { path = "../../core/rhythm-os", features = ["desktop"] }

tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
uuid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"] }
dbus = { version = "0.9.10", features = ["vendored"] }
