[package]
name = "rhythm-addon"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Home Assistant add-on binary for Rhythm OS"

[[bin]]
name = "rhythm-addon"

[dependencies]
rhythm-ha = { path = "../../integrations/rhythm-ha", features = ["desktop"] }
rhythm-hue = { path = "../../integrations/rhythm-hue", features = ["desktop"] }
rhythm-os = { path = "../../core/rhythm-os", features = ["desktop"] }

# Workspace deps
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
log = "0.4"

