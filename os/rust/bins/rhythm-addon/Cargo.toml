[package]
name = "rhythm-addon"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Home Assistant add-on binary for Rhythm OS"

[[bin]]
name = "rhythm-addon"

[dependencies]
rhythm-ha = { path = "../../integrations/rhythm-ha" }
rhythm-os = { path = "../../core/rhythm-os" }
rhythm-os-runtime-modules = { path = "../../../../runtime/rust/rhythm-os-runtime-modules" }

# Workspace deps
tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true, features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
log = "0.4"
