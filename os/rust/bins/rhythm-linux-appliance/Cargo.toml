[package]
name = "rhythm-linux-appliance"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Linux appliance runtime for Rhythm OS"
default-run = "rhythm-linux-appliance"

[[bin]]
name = "rhythm-linux-appliance"

[dependencies]
rhythm-server = { path = "../rhythm-server" }
rhythm-os = { path = "../../core/rhythm-os" }
rhythm-os-runtime-modules = { path = "../../../../runtime/rust/rhythm-os-runtime-modules" }
rhythm-hue = { path = "../../integrations/rhythm-hue", features = ["bluez"] }
rhythm-ble = { path = "../../integrations/rhythm-ble", features = ["bluez"] }
rhythm-ha = { path = "../../integrations/rhythm-ha" }
rhythm-matter = { path = "../../integrations/rhythm-matter" }

tokio = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
log = "0.4"
uuid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"] }
dbus = { version = "0.9.10", features = ["vendored"] }

[dev-dependencies]
tower = { workspace = true }
