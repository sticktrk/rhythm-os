[package]
name = "rhythm-monster"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Monster/Ayla static lighting, BLE Wi-Fi commissioning and cloud key broker client"

[features]
default = []
bluez = ["rhythm-ble/bluez", "dep:bluer", "dep:uuid"]

[dependencies]
rhythm-core = { path = "../../core/rhythm-core" }
rhythm-os = { path = "../../core/rhythm-os" }
rhythm-ble = { path = "../rhythm-ble" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
rand = "0.8"
aes = { version = "0.8", features = ["zeroize"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
zeroize = "1"
anyhow = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"], optional = true }
uuid = { version = "1", optional = true }
