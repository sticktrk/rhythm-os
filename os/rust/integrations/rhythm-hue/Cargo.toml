[package]
name = "rhythm-hue"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Platform-agnostic Philips Hue integration for Rhythm OS"

[features]
default = []
test-support = ["rhythm-core/test-support"]
bluez = ["dep:bluer", "dep:dbus", "dep:uuid", "dep:rhythm-ble"]

[[test]]
name = "integration_flow"
required-features = ["test-support"]

[[test]]
name = "scenario_room_membership"
required-features = ["test-support"]

[[test]]
name = "scenario_authority_capture"
required-features = ["test-support"]

[[test]]
name = "scenario_native_scenes"
required-features = ["test-support"]

[dependencies]
rhythm-core = { path = "../../core/rhythm-core" }
rhythm-devices = { path = "../../core/rhythm-devices" }
rhythm-os = { path = "../../core/rhythm-os" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
log = "0.4"
tracing = { workspace = true }
sha2 = "0.10"

reqwest = { workspace = true }
reqwest-eventsource = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"], optional = true }
dbus = { version = "0.9.10", features = ["vendored"], optional = true }
uuid = { version = "1", optional = true }
rhythm-ble = { path = "../rhythm-ble", features = ["bluez"], optional = true }
