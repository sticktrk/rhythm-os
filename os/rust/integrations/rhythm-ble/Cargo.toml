[package]
name = "rhythm-ble"
version.workspace = true
edition = "2021"
license.workspace = true
description = "Shared local Bluetooth device profiles and adapter runtime for Rhythm OS"

[features]
default = []
bluez = ["dep:bluer", "dep:dbus"]
test-support = []

[dependencies]
rhythm-core = { path = "../../core/rhythm-core" }
rhythm-os = { path = "../../core/rhythm-os" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
log = "0.4"
tokio = { workspace = true }
futures = { workspace = true }
rand = "0.8"
tracing = { workspace = true }
uuid = "1"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", default-features = false, features = ["bluetoothd"], optional = true }
dbus = { version = "0.9.10", features = ["vendored"], optional = true }
