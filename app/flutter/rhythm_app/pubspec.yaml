name: rhythm_app
description: Rhythm Lighting - Adaptive lighting curve configuration app
publish_to: 'none'

version: 2.0.3+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Shared core package with FRB bindings and models
  rhythm_core:
    path: ../rhythm_core

  # Rhythm SDK for server communication
  rhythm_sdk:
    path: ../../../rhythm_sdk

  # State management
  provider: ^6.1.1

  # HTTP client
  dio: ^5.9.1
  http: ^1.2.0

  # Charts
  fl_chart: ^1.1.1

  # Cupertino icons
  cupertino_icons: ^1.0.6
  rust_lib_rhythm_app:
    path: rust_builder
  flutter_rust_bridge: 2.11.1

  # Supabase (auth, database, realtime)
  supabase_flutter: ^2.12.0

  # Google Sign In (native flow)
  google_sign_in: ^7.2.0

  # Apple Sign In (native flow)
  sign_in_with_apple: ^6.0.0
  crypto: ^3.0.0  # For Apple Sign-In nonce hashing

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Storage (shared_preferences only used for one-time migration to Hive)
  shared_preferences: ^2.2.2

  # Package info
  package_info_plus: ^9.0.0

  # Local storage with Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0


  # UUID generation
  uuid: ^4.0.0

  # URL launcher for email/web links
  url_launcher: ^6.2.5

  # Analytics
  posthog_flutter: ^5.13.0



  # mDNS / Bonjour discovery (uses native APIs, works on iOS without multicast entitlement)
  bonsoir: ^6.0.1
  flutter_blue_plus: 1.36.8
  flutter_timezone: ^5.0.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mockito: ^5.6.3
  build_runner: ^2.10.5
  fake_async: ^1.3.1
  clock: ^1.1.1

flutter:
  uses-material-design: true

  assets:
    - assets/
