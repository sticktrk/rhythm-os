[package]
name = "rhythm_core_ffi"
version = "0.1.0"
edition = "2021"
description = "Flutter FFI bindings for rhythm-core"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
rhythm-core = { path = "../../../../os/rust/core/rhythm-core" }
rhythm-profile = { path = "../../../../os/rust/core/rhythm-profile" }
rhythm-hue = { path = "../../../../os/rust/integrations/rhythm-hue" }
flutter_rust_bridge = "=2.11.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# When built standalone by Cargokit, treat as own workspace root
# This prevents "believes it's in a workspace" errors
# Path dependencies still work without being workspace members
[workspace]
