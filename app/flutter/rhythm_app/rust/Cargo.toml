[package]
# Named to match what Dart FFI expects to load
name = "rhythm_core_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
# The actual FFI implementation
rhythm-core = { path = "../../../rhythm-lighting/rust/core/rhythm-core" }
# FFI exposes pure algorithms only — no transport or platform features needed
rhythm-hue = { path = "../../../rhythm-lighting/rust/integrations/rhythm-hue" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Mark as standalone workspace for Cargokit builds
[workspace]
