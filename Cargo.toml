[workspace]
resolver = "2"
members = [
    "app/flutter/rhythm_app/rust",
    "lab/bulb-bench",
    "os/rust/core/rhythm-profile",
    "os/rust/core/rhythm-devices",
    "os/rust/core/rhythm-core",
    "os/rust/core/rhythm-os",
    "os/rust/integrations/rhythm-hue",
    "os/rust/integrations/rhythm-ble",
    "os/rust/integrations/rhythm-ha",
    "os/rust/integrations/rhythm-matter",
    "os/rust/bins/rhythm-server",
    "os/rust/bins/rhythm-host-recorder",
    "os/rust/bins/rhythm-chipd",
    "os/rust/bins/rhythm-linux-appliance",
    "os/rust/bins/rhythm-addon",
    "runtime/rust/rhythm-runtime-api",
    "runtime/rust/rhythm-adaptive",
    "runtime/rust/rhythm-os-runtime-modules",
]

[workspace.package]
version = "0.6.616-beta"
edition = "2021"
license = "Apache-2.0"
authors = ["Tim Kijewski <3043754+sticktrk@users.noreply.github.com>"]
repository = "https://github.com/sticktrk/rhythm-os"
homepage = "https://rhythm.lighting"
description = "Adaptive lighting that follows the sun"

[workspace.dependencies]
# Shared dependencies across workspace
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# HTTP server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "request-id"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
futures = "0.3"

# Math for no_std
libm = "0.2"

# Async traits
async-trait = "0.1"

# Time
chrono = "0.4"

# CLI
clap = { version = "4.0", features = ["derive"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json", "stream"] }
reqwest-eventsource = "0.6"

# Error handling
anyhow = "1.0"

# Logging
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# mDNS
# 0.13.2 adds the missing NSEC type-bitmap bounds check (upstream #291).
mdns-sd = "0.13.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
